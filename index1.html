<!DOCTYPE html>
<html>
    <head>
        <title> Bit & Bytes Tech Hub </title>
    </head>
    <style>
            body{
                background-color: rgba(88, 245, 219, 0.26);
                font-family: Arial, sans-serif;
            }
            h1{
                color:darkblue;
                text-align: center;
                font-size: 42px;
            }
            h2{
                color: darkgreen;
                width: 70%;
                text-align: auto;
            }
            img{
                margin: 15px;
            }

            table{
                border-collapse: collapse;
                padding: left 20px;
                width: 70%;
                display: 100%;
                border: 2px solid black;
                justify-content: center;
                margin: 40px auto;
            }
            th{
                background-color: navy;
                color: white;
            }
            th, td{
                padding: 10px;
            }
            input[type="submit"]{
                background-color: green;
                color: white;
                border: none;
                padding: 10px 20px;
            }
            button{
                background: #0e130c;
                color: white;
                padding: 15px 30px;
                font-size: 18px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
            }
            button:hover{
                background:green;
                transform: scale(1.05);
                cursor: pointer;
            }
            
     </style>
<body>
    <h2>Pricing</h2>
        <table border="1">
            <tr>
                <th>Service Description</th>
                <th>Price (Kes)</th>
            </tr>
            <tr>
                <td>KRA PIN Registration</td>
                <td>100</td>
            </tr>
            <tr>
                <td>KRA Returns</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Wi-Fi Configuration</td>
                <td>Contact us</td>
            </tr>
            <tr>
                <td>CCTV Installation</td>
                <td>Contact Us</td>
            </tr>
        </table>
     <h2> Contact Us</h2>
        <form>
        <label>Name:</label><br>
        <input type="text">

        <br><br>

        <label>Email:</label><br>
        <input type="email">

        <br><br>

        <label>Phone:</label><br>
        <input type="number">

        <br><br>

        <button>submit</button>

        </form>
</body>
</html>
